# DIAGNOSTIC ONLY (fork PR #76): bisect the macos-26 system-UI segfault and
# classify black label-screenshot frames. See _update_data in
# src/napari/_qt/_tests/test_qt_viewer.py.
name: DIAG macos-26 label frames

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag ${{ matrix.variant }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fusion avoids the AppKit/Metal crash (0/6 vs 6/6 native), so every
          # iteration reaches the label tests; mismatches read GL textures back
          - variant: fusion_readback
            selection: "label_colors_matching_widget"
            style: "Fusion"
    env:
      NAPARI_DIAG_LABELS: ${{ github.workspace }}/diag/diag.jsonl
      NAPARI_DIAG_NO_CONTROLS: ${{ matrix.no_controls }}
      QT_STYLE_OVERRIDE: ${{ matrix.style }}
      VARIANT: ${{ matrix.variant }}
      SELECTION: ${{ matrix.selection }}
      ITERATIONS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install napari (same pins as the tox jobs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c resources/constraints/constraints_py3.14.txt -e ".[pyqt6]" --group testing
          python -c "from qtpy import QT_VERSION; print('Qt', QT_VERSION)"
          sw_vers

      - name: Reduce transparency
        if: matrix.variant == 'reduce_transparency'
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool true \
            || sudo defaults write com.apple.universalaccess reduceTransparency -bool true \
            || echo "could not set reduceTransparency"
          defaults read com.apple.universalaccess reduceTransparency || true

      - name: Run tests repeatedly, one fresh process each
        run: |
          mkdir -p diag
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::iteration $i"
            set +e
            python -m pytest src/napari/_qt/_tests/test_qt_viewer.py \
              -k "$SELECTION" \
              --maxfail=1000 -p no:rerunfailures -q -p no:cacheprovider \
              > "diag/iter_$i.log" 2>&1
            code=$?
            set -e
            tail -n 60 "diag/iter_$i.log"
            echo "iteration $i exit $code" | tee -a diag/exits.txt
            echo "::endgroup::"
          done

      - name: Summarise
        if: always()
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, glob, json, os, re
          print(f"## {os.environ['VARIANT']}\n")
          for line in open('diag/exits.txt'):
              print('-', line.strip())
          print()
          for log in sorted(glob.glob('diag/iter_*.log')):
              text = open(log).read()
              for block in text.split("Current thread's C stack")[1:]:
                  frames = re.findall(r'Binary file "([^"]+)", at (\S+)', block)
                  if len(frames) > 4:
                      lib, sym = frames[4]
                      print(f"- {log}: crash in {lib.rsplit('/', 1)[-1]} {sym[:60]}")
              m = re.search(r'(\d+) failed', text)
              if m:
                  print(f'- {log}: {m.group(0)}')
          path = os.environ['NAPARI_DIAG_LABELS']
          if not os.path.exists(path):
              print('\nno diag file'); raise SystemExit
          rs = [json.loads(line) for line in open(path)]
          gl = [r for r in rs if r['event'] == 'gl']
          grabs = [r for r in rs if r['event'] == 'grab']
          bad = [r for r in rs if r['event'] == 'mismatch']
          print(f"\nGL: {gl[0] if gl else 'n/a'}\n")
          print(f'grabs: {len(grabs)}, mismatches: {len(bad)}\n')
          print('draw events per grab (ok / mismatch):',
                dict(collections.Counter(r['n_draws'] for r in grabs if r['ok'])),
                dict(collections.Counter(r['n_draws'] for r in grabs if not r['ok'])), '\n')
          for r in bad:
              print(f"- {r['test'].split('::')[-1]} label {r['label']}: {json.dumps(r.get('textures'))}")
          if bad:
              print('| test | label | expected | middle | all bg | all black | draws | slice | node vis | node data | now ok | wait ok |')
              print('|---|---|---|---|---|---|---|---|---|---|---|---|')
          for r in bad:
              t = r['test'].split('::')[-1]
              print(f"| {t} | {r['label']} | {r['expected']} | {r['middle']} | {r['frame_all_bg']} | "
                    f"{r['frame_all_black']} | {r['n_draws']} | {r['slice_raw']} | {r['node_visible']} | "
                    f"{r['node_data']} | {r['now_ok']} | {r['wait_ok']} |")
          EOF

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-macos26-${{ matrix.variant }}
          path: diag
