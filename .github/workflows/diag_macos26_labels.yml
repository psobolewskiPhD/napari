# DIAGNOSTIC ONLY (fork PR #76): classify the black label-screenshot frames
# on macos-26 runners. See _update_data in src/napari/_qt/_tests/test_qt_viewer.py.
name: DIAG macos-26 label frames

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag macos-latest label frames
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NAPARI_DIAG_LABELS: ${{ github.workspace }}/diag/diag.jsonl
      ITERATIONS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install napari (same pins as the tox jobs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c resources/constraints/constraints_py3.14.txt -e ".[pyqt6]" --group testing
          python -c "from qtpy import QT_VERSION; print('Qt', QT_VERSION)"
          sw_vers

      - name: Run label colour tests repeatedly
        run: |
          mkdir -p diag
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::iteration $i"
            python -m pytest src/napari/_qt/_tests/test_qt_viewer.py \
              -k "label_colors_matching_widget" \
              --maxfail=1000 -p no:rerunfailures -q -p no:cacheprovider \
              || echo "iteration $i: pytest exit $?" | tee -a diag/exits.txt
            echo "::endgroup::"
          done

      - name: Summarise
        if: always()
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, os
          path = os.environ['NAPARI_DIAG_LABELS']
          if not os.path.exists(path):
              print('no diag file'); raise SystemExit
          rs = [json.loads(line) for line in open(path)]
          gl = [r for r in rs if r['event'] == 'gl']
          grabs = [r for r in rs if r['event'] == 'grab']
          bad = [r for r in rs if r['event'] == 'mismatch']
          print('## macos-26 label frame diagnostics\n')
          print(f"GL: {gl[0] if gl else 'n/a'}\n")
          print(f'grabs: {len(grabs)}, mismatches: {len(bad)}\n')
          print('draw events per grab (ok / mismatch):',
                dict(collections.Counter(r['n_draws'] for r in grabs if r['ok'])),
                dict(collections.Counter(r['n_draws'] for r in grabs if not r['ok'])), '\n')
          print('| test | label | expected | middle | all bg | all black | draws | slice | node vis | node data | now ok | wait ok |')
          print('|---|---|---|---|---|---|---|---|---|---|---|---|')
          for r in bad:
              t = r['test'].split('::')[-1]
              print(f"| {t} | {r['label']} | {r['expected']} | {r['middle']} | {r['frame_all_bg']} | "
                    f"{r['frame_all_black']} | {r['n_draws']} | {r['slice_raw']} | {r['node_visible']} | "
                    f"{r['node_data']} | {r['now_ok']} | {r['wait_ok']} |")
          EOF

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-macos26-labels
          path: diag
